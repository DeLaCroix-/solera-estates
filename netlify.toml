[build]
  command = "npm run check:all"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PUBLIC_SITE_INDEXABLE = "false"
  PUBLIC_SITE_URL = "https://soleraestates.eu"

[context.production.environment]
  PUBLIC_SITE_INDEXABLE = "true"

[dev]
  command = "npm run dev"
  targetPort = 4179
  framework = "#custom"
